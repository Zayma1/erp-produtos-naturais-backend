server:
  port: 8080

spring:
  application:
    name: erp-produtos-naturais-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/vilaverde_erp
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.vilaverde.erp: DEBUG
